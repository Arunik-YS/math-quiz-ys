<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>연산 실력 쑥쑥! 곱셈과 나눗셈</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 24px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-size: 1.3rem;
      color: #334155;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .name-input-group input {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      text-align: center;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      margin-bottom: 16px;
    }
    .start-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background-color: #3b82f6;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #f1f5f9;
      padding: 12px 8px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: #1e293b;
    }
    .stat-value.wrong { color: #ef4444; }
    .stat-value.correct { color: #3b82f6; }

    .notice-msg {
      min-height: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #ef4444;
      margin-bottom: 8px;
    }

    .problem-box {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f172a;
      margin: 8px 0 20px 0;
    }
    .inputs-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      min-height: 70px;
    }
    .input-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .input-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 6px;
    }
    .square-box {
      width: 90px;
      height: 56px;
      border: 3px solid #cbd5e1;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: #1e293b;
      background-color: #f8fafc;
      cursor: pointer;
    }
    .square-box.active {
      border-color: #3b82f6;
      background-color: #eff6ff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }
    @keyframes blinkRed {
      0%, 100% { background-color: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
      25%, 75% { background-color: #fee2e2; border-color: #ef4444; color: #dc2626; }
    }
    .square-box.blink-error {
      animation: blinkRed 0.6s ease-in-out;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .key-btn {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 0;
      font-size: 1.4rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .key-btn:active { background-color: #e2e8f0; }
    .key-btn.action { background-color: #f1f5f9; color: #475569; font-size: 1.1rem; }
    .key-btn.submit { background-color: #3b82f6; color: white; border: none; font-size: 1.2rem; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- 이름 입력 화면 -->
  <div class="card" id="name-screen">
    <h1>연산 실력 쑥쑥! 퀴즈</h1>
    <p style="color: #64748b; margin-bottom: 16px; font-size: 0.95rem;">이름을 적고 시작하세요.<br><strong>[곱셈 10개 ➔ 나눗셈 10개 ➔ 혼합]</strong> 순서로 진격!</p>
    
    <div class="name-input-group">
      <input type="text" id="student-name-input" placeholder="예: 1번 홍길동" maxlength="15" autocomplete="off">
      <button class="start-btn" onclick="startQuiz()">도전 시작하기</button>
    </div>
  </div>

  <!-- 퀴즈 화면 -->
  <div class="card hidden" id="quiz-screen">
    <div style="font-size: 0.9rem; color: #64748b; font-weight: bold; margin-bottom: 10px;" id="display-student-info"></div>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">맞힌 문제</span>
        <span class="stat-value correct" id="solved-count">0개</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">틀린 횟수</span>
        <span class="stat-value wrong" id="wrong-count">0회</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">평균 소요 시간</span>
        <span class="stat-value" id="avg-time">0.0초</span>
      </div>
    </div>

    <div class="notice-msg" id="notice-msg"></div>
    <div class="problem-box" id="problem-text"></div>
    <div class="inputs-container" id="inputs-container"></div>

    <div class="keypad">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn action" onclick="pressKey('delete')">⌫</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn submit" onclick="checkAnswer()">확인</button>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // [설정] 단계 통과 기준 문제 수 (원하는 숫자로 수정 가능)
    // ----------------------------------------------------
    const PASS_THRESHOLD = 10; // 각 단계별로 10개씩 맞히면 통과!

    const firebaseConfig = {
      apiKey: "AIzaSyAkeZtBoYd-3zNcj7KG-98twjXTcAnkOVY",
      authDomain: "math-quiz-ys.firebaseapp.com",
      databaseURL: "https://math-quiz-ys-default-rtdb.firebaseio.com",
      projectId: "math-quiz-ys",
      storageBucket: "math-quiz-ys.firebasestorage.app",
      messagingSenderId: "403911938388",
      appId: "1:403911938388:web:b0383e38e8ec02aedff8c1"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let studentName = '';
    let selectedMode = 'multi'; // 곱셈부터 시작
    let stageSolvedCount = 0;   // 현재 단계에서 맞힌 문제 수
    let studentKey = '';
    let totalSolvedCount = 0;
    let wrongCount = 0;
    let startTime = 0;
    let isChecking = false;

    let currentProblem = {};
    let activeBoxId = 'box-ans';
    let inputValues = { ans: '', q: '', r: '' };

    function getModeText(mode) {
      if (mode === 'multi') return '✖️ 곱셈 단계';
      if (mode === 'div') return '➗ 나눗셈 단계';
      return '🔀 마스터 혼합 단계';
    }

    function startQuiz() {
      const nameInput = document.getElementById('student-name-input').value.trim();
      if (!nameInput) {
        alert('이름을 입력해 주세요!');
        return;
      }
      studentName = nameInput;
      studentKey = studentName.replace(/[.#$/\[\]]/g, "_") + "_" + Date.now();
      startTime = Date.now();

      document.getElementById('display-student-info').textContent = `👤 ${studentName} (${getModeText(selectedMode)})`;
      document.getElementById('name-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      sendDataToFirebase();
      setInterval(updateLocalDisplay, 1000);
      generateProblem();
    }

    function sendDataToFirebase() {
      if (!studentKey) return;
      const elapsedSeconds = (Date.now() - startTime) / 1000;
      const avgTime = totalSolvedCount > 0 ? (elapsedSeconds / totalSolvedCount).toFixed(1) : "0.0";

      database.ref('students/' + studentKey).set({
        name: studentName,
        mode: selectedMode,
        solvedCount: totalSolvedCount,
        wrongCount: wrongCount,
        avgTime: parseFloat(avgTime),
        lastActive: Date.now()
      });
    }

    function updateLocalDisplay() {
      document.getElementById('solved-count').textContent = `${totalSolvedCount}개`;
      document.getElementById('wrong-count').textContent = `${wrongCount}회`;

      const elapsedSeconds = (Date.now() - startTime) / 1000;
      const avg = totalSolvedCount > 0 ? (elapsedSeconds / totalSolvedCount).toFixed(1) : "0.0";
      document.getElementById('avg-time').textContent = `${avg}초`;
    }

    function showNotice(msg) {
      const noticeEl = document.getElementById('notice-msg');
      noticeEl.textContent = msg;
      setTimeout(() => {
        if (noticeEl.textContent === msg) noticeEl.textContent = '';
      }, 2000);
    }

    function generateProblem() {
      inputValues = { ans: '', q: '', r: '' };

      let problemType = selectedMode;
      if (selectedMode === 'mix') {
        problemType = Math.random() < 0.5 ? 'multi' : 'div';
      }

      if (problemType === 'multi') {
        const num1 = Math.floor(Math.random() * 8) + 2;
        const num2 = Math.floor(Math.random() * 9) + 1;
        currentProblem = { type: 'multi', ans: num1 * num2, text: `${num1} × ${num2}` };
        activeBoxId = 'box-ans';
      } else {
        const divisor = Math.floor(Math.random() * 8) + 2;
        const isThreeDigits = Math.random() < 0.5;
        const dividend = isThreeDigits 
          ? Math.floor(Math.random() * 900) + 100 
          : Math.floor(Math.random() * 90) + 10;

        currentProblem = {
          type: 'div',
          q: Math.floor(dividend / divisor),
          r: dividend % divisor,
          text: `${dividend} ÷ ${divisor}`
        };
        activeBoxId = 'box-q';
      }

      renderUI();
    }

    function renderUI() {
      document.getElementById('problem-text').textContent = `${currentProblem.text} = ?`;
      const container = document.getElementById('inputs-container');
      container.innerHTML = '';

      if (currentProblem.type === 'multi') {
        container.innerHTML = `
          <div class="input-wrapper">
            <div class="input-label">정답</div>
            <div class="square-box ${activeBoxId === 'box-ans' ? 'active' : ''}" id="box-ans" onclick="setActiveBox('box-ans')">
              ${inputValues.ans}
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="input-wrapper">
            <div class="input-label">몫</div>
            <div class="square-box ${activeBoxId === 'box-q' ? 'active' : ''}" id="box-q" onclick="setActiveBox('box-q')">
              ${inputValues.q}
            </div>
          </div>
          <div style="font-size: 1.5rem; font-weight: bold; color: #94a3b8; align-self: flex-end; margin-bottom: 12px;">...</div>
          <div class="input-wrapper">
            <div class="input-label">나머지</div>
            <div class="square-box ${activeBoxId === 'box-r' ? 'active' : ''}" id="box-r" onclick="setActiveBox('box-r')">
              ${inputValues.r}
            </div>
          </div>
        `;
      }
    }

    function setActiveBox(boxId) {
      if (isChecking) return;
      activeBoxId = boxId;
      document.querySelectorAll('.square-box').forEach(box => box.classList.remove('active'));
      const el = document.getElementById(boxId);
      if (el) el.classList.add('active');
    }

    function pressKey(key) {
      if (isChecking) return;
      const targetKey = activeBoxId === 'box-ans' ? 'ans' : (activeBoxId === 'box-q' ? 'q' : 'r');

      if (key === 'delete') {
        inputValues[targetKey] = inputValues[targetKey].slice(0, -1);
      } else {
        if (inputValues[targetKey].length < 4) {
          inputValues[targetKey] += key;
        }
      }

      const el = document.getElementById(activeBoxId);
      if (el) el.textContent = inputValues[targetKey];
    }

    function checkAnswer() {
      if (isChecking) return;

      if (currentProblem.type === 'multi') {
        if (inputValues.ans.trim() === '') {
          showNotice('정답을 입력해 주세요!');
          return;
        }
      } else {
        if (inputValues.q.trim() === '' || inputValues.r.trim() === '') {
          showNotice('몫과 나머지를 모두 입력해 주세요!');
          return;
        }
      }

      let isCorrect = false;

      if (currentProblem.type === 'multi') {
        if (parseInt(inputValues.ans, 10) === currentProblem.ans) isCorrect = true;
      } else {
        if (parseInt(inputValues.q, 10) === currentProblem.q && parseInt(inputValues.r, 10) === currentProblem.r) isCorrect = true;
      }

      if (isCorrect) {
        totalSolvedCount++;
        stageSolvedCount++;

        // 승급 조건 체크
        if (selectedMode === 'multi' && stageSolvedCount >= PASS_THRESHOLD) {
          selectedMode = 'div';
          stageSolvedCount = 0;
          alert(`🎉 축하합니다! 곱셈 ${PASS_THRESHOLD}문제를 모두 통과하여 '나눗셈' 단계로 진입합니다!`);
        } else if (selectedMode === 'div' && stageSolvedCount >= PASS_THRESHOLD) {
          selectedMode = 'mix';
          stageSolvedCount = 0;
          alert(`🎉 대단합니다! 나눗셈 ${PASS_THRESHOLD}문제를 통과하여 '마스터 혼합' 단계에 진입합니다!`);
        }

        document.getElementById('display-student-info').textContent = `👤 ${studentName} (${getModeText(selectedMode)})`;
        updateLocalDisplay();
        sendDataToFirebase();
        generateProblem();
      } else {
        isChecking = true;
        wrongCount++;
        updateLocalDisplay();
        sendDataToFirebase();

        const boxes = document.querySelectorAll('.square-box');
        boxes.forEach(box => box.classList.add('blink-error'));

        setTimeout(() => {
          inputValues = { ans: '', q: '', r: '' };
          boxes.forEach(box => {
            box.classList.remove('blink-error');
            box.textContent = '';
          });
          activeBoxId = currentProblem.type === 'multi' ? 'box-ans' : 'box-q';
          setActiveBox(activeBoxId);
          isChecking = false;
        }, 600);
      }
    }
  </script>
</body>
</html>
